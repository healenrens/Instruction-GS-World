benchmark: physion
protocol: physion_v1_custom_hdf5_pair_cued_prefix_matched_8frame
scope: pilot
seed: 17
attempt: physioncue02_clock
num_classes: 2
manifest: ${BENCH_ROOT}/physion/manifest.json
output_root: ${BENCH_ROOT}/experiments
device: cuda:0
data:
  root: ${BENCH_ROOT}/physion
  scenarios: [Collide, Contain, Dominoes, Drape, Drop, Link, Roll, Support]
  download_limit: 32
  dev_fraction: 0.2
  input_frame_indices: [0, 5, 10, 15, 20, 25, 30, 36]
  fps: 30.0  # Paper-reported movie FPS; no timestamps measured from this HDF5 batch.
  prefix_source: custom pDEIT-derived frame0..36 prefix (nominal last time 1.2s at paper FPS); NOT the paper observed 1.5s protocol
  time_basis: Physion arXiv2106.08261v3 section2.2 reports30fps; frame-position time inferred, not HDF5-measured
  pair_cue_alpha: 0.65
  image_variant: custom HDF5 prefix-only target-red zone-yellow alpha tint; not official material rerender
export:
  frames: 16
  token_budget: 4096
  frame_batch: 16
  observed_segments: 2
models:
  dino_repository: ${DINO_REPOSITORY}
  dino_weights: ${DINO_WEIGHTS}
  vjepa_repository: ${VJEPA_REPOSITORY}
  vjepa_weights: ${VJEPA_WEIGHTS}
  vjepa_factory: vjepa2_vit_large
  vjepa_checkpoint_key: target_encoder
  vjepa_crop: 256
  teacher_checkpoint: ${TEACHER_CHECKPOINT}
probe:
  width: 128
  heads: 4
  batch_size: 32
  epochs: 20
  lr: 0.001
  weight_decay: 0.01
  save_every: 100
  linear_tokens: 16
  linear_cv: 5
  linear_logspace: [-8, 8, 17]
  linear_max_iter: 200
