benchmark: physion
protocol: physion_v1_input_prefix_matched_8frame
scope: pilot
seed: 17
attempt: pilot01
num_classes: 2
manifest: ${BENCH_ROOT}/physion/manifest.json
output_root: ${BENCH_ROOT}/experiments
device: cuda:0
data:
  root: ${BENCH_ROOT}/physion
  scenarios: [Collide, Contain, Dominoes, Drape, Drop, Link, Roll, Support]
  download_limit: 32
  dev_fraction: 0.2
  input_frame_indices: [0, 5, 10, 15, 20, 25, 30, 36]
  fps: 60.0
  prefix_source: physics-models pDEIT input STATE_LEN=7 SUBSAMPLE_FACTOR=6; matched sample ends at frame36
  time_basis: nominal 60Hz; must confirm actual simulator timestamps before temporal claims
  image_variant: S3 readout training declared redyellow by official README; testing HDF5 coloring unconfirmed until sample review
export:
  frames: 16
  token_budget: 4096
  frame_batch: 16
  observed_segments: 2
models:
  dino_repository: ${DINO_REPOSITORY}
  dino_weights: ${DINO_WEIGHTS}
  vjepa_repository: ${VJEPA_REPOSITORY}
  vjepa_weights: ${VJEPA_WEIGHTS}
  vjepa_factory: vjepa2_vit_large
  vjepa_checkpoint_key: target_encoder
  vjepa_crop: 256
  teacher_checkpoint: ${TEACHER_CHECKPOINT}
probe:
  width: 128
  heads: 4
  batch_size: 32
  epochs: 20
  lr: 0.001
  weight_decay: 0.01
  save_every: 100
  linear_tokens: 16
  linear_cv: 5
  linear_logspace: [-8, 8, 17]
  linear_max_iter: 200
